# Gemini Code Assist 設定（PR オープン時に要約とコードレビューを実行）
have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
ignore_patterns:
  - "**/node_modules/**"
  - "**/pnpm-lock.yaml"
  - "**/go.sum"
  - "**/*.lock"
  - "**/dist/**"
  - "**/.next/**"
